[project]
name = "code-rag-cli"
version = "0.1.0"
description = "Terminal-based Code-RAG tool: index a codebase, ask questions, get answers with file and line references."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mete Yılmaz" }]
keywords = ["rag", "code-search", "cli", "embeddings", "tree-sitter", "chromadb", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pathspec>=0.12",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.2",
    "fastembed>=0.3",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
gemini = ["langchain-google-genai>=2.0"]
ollama = ["langchain-ollama>=0.2"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/meteyilmaz01/code-rag-cli"
Issues = "https://github.com/meteyilmaz01/code-rag-cli/issues"

[project.scripts]
coderag = "coderag.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coderag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
