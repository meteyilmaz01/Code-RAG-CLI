[project]
name = "code-rag-cli"
version = "0.1.0"
description = "Terminal tabanlı Code-RAG aracı: kod tabanını indeksler, sorulara satır referanslı yanıt verir."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pathspec>=0.12",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.2",
    "fastembed>=0.3",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
gemini = ["langchain-google-genai>=2.0"]
ollama = ["langchain-ollama>=0.2"]
dev = ["pytest>=8.0"]

[project.scripts]
coderag = "cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "config"]

[tool.setuptools.packages.find]
include = ["core*"]
